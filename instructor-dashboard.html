<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Instructor TA Assignments</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ebf6;color:#252329;font:14px Arial,sans-serif;padding:12px}nav{display:flex;border-radius:40px;background:#faf7f8;box-shadow:0 1px 2px #aaa;margin-bottom:16px}nav button{flex:1;border:0;padding:18px;background:transparent;border-radius:40px;color:#40384b;font-weight:600}nav .active{background:#e7dcf7}main{background:#faf7f8;border-radius:10px;padding:18px;max-width:1500px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;font-weight:500;margin:0}button,select{font:inherit;cursor:pointer}button.outline,select{border:1px solid #aaa;border-radius:24px;padding:10px 18px;background:transparent;color:#694ca5;font-weight:600}.tools{display:flex;align-items:center;gap:12px;margin:20px 0 8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th,td{padding:16px 12px;border-bottom:1px solid #ded8df}th{font-size:13px}td{font-size:14px}.status{display:inline-block;padding:6px 10px;border-radius:7px;font-weight:500}.sent{background:#e0e8f8;color:#334e82}.accepted{background:#e0eddf;color:#285d38}.declined{background:#f4dfe3;color:#873b49}.expired{background:#f6e7d1;color:#80531c}.awaiting{background:#e9dff7;color:#63448a}.completed{background:#d4eadb;color:#245d3b}.withdrawn{background:#e8e3eb;color:#514b59}footer{text-align:right;padding:20px 8px 8px;color:#625b68;font-size:12px}.note{font-size:12px;color:#625b68;margin-top:14px}button:focus-visible,select:focus-visible{outline:2px solid #694ca5;outline-offset:3px}</style><nav><button disabled title="Not implemented in this prototype">☷ &nbsp; Preferences</button><button class="active" aria-current="page">▣ &nbsp; Assignments</button></nav><main><header><h1>Fall 2026 Hiring Assignments for Systems Fundamentals</h1><button class="outline" id="download">Download CSV</button></header><div class="tools"><label for="filter">Status:</label><select id="filter"><option>All statuses</option></select></div><div class="scroll"><table><thead><tr><th>Name</th><th>Onyen</th><th>Email</th><th>Hiring Level</th><th>Status</th><th>Offer Deadline</th></tr></thead><tbody id="rows"></tbody></table></div><footer id="count"></footer><div class="note">Instructor view · Read-only · Fictional student data for demonstration. Draft assignments are not visible.</div></main><script>
const levels=['10h UTA ($2000.00)','5h UTA ($1000.00)','5h UTA via COMP227 for Course Credit ($0.00)'];const statuses=['Offer Sent','Student Accepted','Student Declined','Offer Expired','Awaiting I-9','Hiring Completed','Offer Withdrawn'];const classes=['sent','accepted','declined','expired','awaiting','completed','withdrawn'];const raw=[['Alex Morgan','amorgan',0,0],['Jordan Lee','jlee',0,1],['Taylor Smith','tsmith',1,0],['Jamie Wilson','jwilson',2,1],['Casey Brown','cbrown',0,2],['Morgan Davis','mdavis',0,3],['Riley Clark','rclark',1,4],['Cameron Jones','cjones',0,5],['Drew Miller','dmiller',0,6],['Avery Chen','achen',2,5],['Sam Rivera','srivera',0,5]];const data=raw.map(([name,id,l,s])=>({name,id,email:id+'@example.edu',level:levels[l],status:statuses[s],style:classes[s],deadline:s===0?'Dec 11, 2026, 11:59 PM':s===3?'Nov 20, 2026, 11:59 PM':'—'}));const filter=document.getElementById('filter');statuses.forEach(s=>filter.add(new Option(s,s)));function visible(){return data.filter(r=>filter.value==='All statuses'||r.status===filter.value)}function render(){const rows=document.getElementById('rows');rows.replaceChildren();visible().forEach(r=>{const tr=rows.insertRow();for(const k of ['name','id','email','level','status','deadline']){const td=tr.insertCell();if(k==='status'){const span=document.createElement('span');span.className='status '+r.style;span.textContent=r[k];td.append(span)}else td.textContent=r[k]}});document.getElementById('count').textContent=visible().length+' assignments'}filter.onchange=render;render();document.getElementById('download').onclick=()=>{const quote=s=>'"'+String(s).replaceAll('"','""')+'"';const csv=[['Name','Onyen','Email','Hiring Level','Status','Offer Deadline'],...visible().map(r=>[r.name,r.id,r.email,r.level,r.status,r.deadline])].map(r=>r.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='instructor_assignments.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
